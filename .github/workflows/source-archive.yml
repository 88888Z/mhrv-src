name: source-archive
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: git archive --format=zip -o source.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: source.zip
      - name: Remove auto-generated codeload archive
        run: |
          gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} \
            -q '.assets[] | select(.name | test("^source code")) | .id' \
          | while read id; do
              gh api repos/${{ github.repository }}/releases/assets/$id -X DELETE
            done
