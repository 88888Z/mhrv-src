name: source-archive
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      current_version:
        description: 'Your current local version (e.g. v1.9.26). Leave empty for first-time clone.'
        required: false
        type: string
      target_version:
        description: 'Target version to update to (default: latest)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target
        id: target
        run: |
          REF="${{ inputs.target_version || github.ref_name }}"
          if [ "$REF" = "main" ]; then
            REF=$(gh api repos/therealaleph/MasterHttpRelayVPN-RUST/releases/latest -q '.tag_name')
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
      - name: Build source archive
        run: |
          CURRENT=${{ steps.target.outputs.ref }}
          CURRENT_LOCAL="${{ inputs.current_version }}"
          if [ -z "$CURRENT_LOCAL" ] || [ "$CURRENT_LOCAL" = "main" ]; then
            # First-time: source zip (no git history needed)
            git archive --format=zip -o "source-${CURRENT}.zip" HEAD
          else
            # Update: patch files between versions (small)
            git fetch --depth=1 origin "+refs/tags/${CURRENT_LOCAL}:refs/tags/${CURRENT_LOCAL}" \
              https://github.com/therealaleph/MasterHttpRelayVPN-RUST.git \
              "+refs/tags/${CURRENT_LOCAL}:refs/tags/${CURRENT_LOCAL}" 2>/dev/null || true
            git format-patch -o patches "$CURRENT_LOCAL..$CURRENT"
            tar czf "patches-${CURRENT_LOCAL}-to-${CURRENT}.tar.gz" patches/
          fi
          # Auto-trigger: always include previous-tag patches
          if [ "${{ github.event_name }}" = "push" ]; then
            PREV=$(git tag --sort=version:refname | grep '^v[0-9]' \
              | sed -n "/$CURRENT/q;p" | tail -1)
            if [ -n "$PREV" ]; then
              git format-patch -o prev-patches "$PREV..$CURRENT"
              tar czf "patches-${PREV}-to-${CURRENT}.tar.gz" prev-patches/
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.ref }}
          files: |
            source-*.zip
            patches-*.tar.gz
          overwrite: true
      - name: Remove auto-generated codeload archives
        run: |
          gh api repos/${{ github.repository }}/releases/tags/${{ steps.target.outputs.ref }} \
            -q '.assets[] | select(.name | test("^[Ss]ource [Cc]ode")) | .id' \
          | while read id; do
              gh api repos/${{ github.repository }}/releases/assets/$id -X DELETE
            done
